<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVYR DIGITAL - Executive vCard</title>
    <link href="style.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk, EB Garamond, Montserrat, Space Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=EB+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <!-- ==========================================================================
     MODULE: AVYR DIGITAL EXECUTIVE VCARD
     ========================================================================== -->
<section class="cyber-vcard-module">
    
    <!-- Layer 1: Kinetic Particle Network -->
    <canvas class="vcard-particle-canvas" aria-hidden="true"></canvas>
    
    <!-- Layer 2: Glassmorphism Interface -->
    <article class="vcard-glass-panel avyr-reveal">
        
        <!-- Identity Anchor -->
        <header class="vcard-identity">
            <div class="vcard-monogram glow-interactive">
                <span class="monogram-text">SC</span>
            </div>
            
            <h1 class="vcard-name">Salaheddine CHIKHI</h1>
            <h2 class="vcard-role">Fondateur & Architecte Digital</h2>
            <p class="vcard-tagline">Digital Elegance. Powered by Data Logic.</p>
        </header>

        <!-- Action Node -->
        <div class="vcard-action">
            <button class="btn-download glow-interactive">
                <span class="material-symbols-outlined icon-dl">download</span>
                Save Executive Contact (.vcf)
            </button>
        </div>

        <!-- Terminal Data Grid -->
        <footer class="vcard-data-grid">
            <div class="terminal-header">
                <span class="material-symbols-outlined terminal-icon">terminal</span>
                <span class="terminal-text">COMM_LINKS // SECURE</span>
            </div>
            
            <address class="data-list">
                <div class="data-row">
                    <span class="material-symbols-outlined icon-cyan">mail</span>
                    <a href="mailto:s.chikhi@avyrdigital.com" class="data-value">s.chikhi@avyrdigital.com</a>
                </div>
                
                <div class="data-row">
                    <span class="material-symbols-outlined icon-cyan">language</span>
                    <a href="https://avyrdigital.com" target="_blank" rel="noopener noreferrer" class="data-value">avyrdigital.com</a>
                </div>

                <div class="data-row">
                    <svg class="icon-cyan" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="margin-left: 2px; margin-right: 2px;">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.058-1.69-.072-4.949-.072zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.162 6.162 6.162 6.162-2.759 6.162-6.162-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                    </svg>
                    <a href="https://www.instagram.com/avyr.digital?igsh=bGxjOHg3aTRvNG40" target="_blank" rel="noopener noreferrer" class="data-value">@avyr.digital</a>
                </div>
                
                <div class="data-row">
                    <span class="material-symbols-outlined icon-cyan">location_on</span>
                    <span class="data-value">Casablanca, MA</span>
                </div>
            </address>
        </footer>
        
    </article>
</section>
    <script src="script.js" defer></script>
</body>
</html>
